name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 24 for CI: the packages' unit tests run TypeScript directly via
          # --experimental-strip-types (Node >=22.6). The published libraries still
          # target node >=20 (they ship compiled JS).
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@prdctr-foundation"

      - run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm -r build

      - name: typecheck
        run: |
          pnpm -r run typecheck
          pnpm -r run types:check

      - name: test
        run: pnpm -r run test

      - name: lint
        run: pnpm lint

      - name: catalog consistency
        run: pnpm run lint:catalog
